# pyOpenSci website (Hugo)

baseURL = 'https://www.pyopensci.org/'
languageCode = 'en-us'
title = 'pyOpenSci'
theme = 'clean-hugo'
timeZone = 'America/Denver'

enableRobotsTXT = true
buildFuture = true

# Site images live in static/images/ (published as /images/...).
# Peer-review badges live in static/badges/ (published as /badges/...).

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = 'monokai'
    lineNos = false
    noClasses = false
    codeFences = true
    guessSyntax = true

[params]
  author = 'pyOpenSci'
  tagline = 'We support the open source contributors and developers who fuel scientific discovery.'

  # Upper-left nav: logo image (served from static/images/).
  [params.nav_logo]
    src = 'images/logo-white.png'
    alt = 'pyOpenSci logo: white flower icon above pyOpenSci wordmark.'
  blog_title = 'pyOpenSci Blog'
  description = 'pyOpenSci broadens participation in scientific open source.'

  # Blog in-page TOC ("On this page"). Set true to re-enable sidebar TOC.
  [params.blog]
    enable_toc = false

  [params.seo]
    default_image = 'images/landing-pages/scipy-sprint-working.png'
    twitter_site = 'pyOpenSci'

  [params.social]
    type = 'Organization'
    github = 'https://github.com/pyopensci'
    bluesky = 'https://bsky.app/profile/pyopensci.org'
    linkedin = 'https://www.linkedin.com/company/pyopensci/'
    mastodon = 'https://fosstodon.org/@pyOpenSci'
    youtube = 'https://www.youtube.com/@pyopensci'

  [params.footer]
    follow_label = 'Follow'
    mission = '''pyOpensci is dedicated to creating a welcoming, supportive and diverse community around the open source Python tools that drive open science. Our <a href="https://www.pyopensci.org/handbook/CODE_OF_CONDUCT.html" target="_blank" rel="noopener noreferrer">Code of Conduct</a> defines expected behavior and guidelines that help create such a community. pyOpenSci is a fiscally sponsored project of <a href="https://communityinitiatives.org/" target="_blank" rel="noopener noreferrer">Community Initiatives</a>, a registered 501(c)3 non-profit organization based in California, USA. pyOpenSci is grateful for support from the <a href="https://sloan.org/" target="_blank" rel="noopener noreferrer">Sloan Foundation</a> and the <a href="https://chanzuckerberg.com/" target="_blank" rel="noopener noreferrer">Chan Zuckerberg Initiative</a>.'''

[[params.footer.links]]
  label = 'Mastodon'
  icon = 'fab fa-fw fa-mastodon'
  url = 'https://fosstodon.org/@pyOpenSci'
  rel_me = true

[[params.footer.links]]
  label = 'Bluesky'
  icon = 'fa-solid fa-cloud'
  url = 'https://bsky.app/profile/pyopensci.org'

[[params.footer.links]]
  label = 'LinkedIn'
  icon = 'fab fa-fw fa-linkedin'
  url = 'https://www.linkedin.com/company/pyopensci'

[[params.footer.links]]
  label = 'GitHub'
  icon = 'fab fa-fw fa-github'
  url = 'https://github.com/pyOpenSci'

[[params.footer.links]]
  label = 'YouTube'
  icon = 'fa-brands fa-youtube'
  url = 'https://www.youtube.com/@pyopensci'

[params.theme]
  enableFontAwesome = true

  [params.theme.fonts]
    heading = 'Poppins'
    body = 'Nunito Sans'

  [params.theme.colors]
    # Brand: nav, footer, h1/h2, main button. textOnDark sits on it.
    brand = '#33205C'
    # Main button when hovered.
    brandHover = '#542668'
    # Outline button borders, focus rings, How it works icons. No text on it.
    brandOutline = '#735FAB'
    # Tag chips, table headers, section dividers. Brand-colored text on it.
    brandTint = '#BAB3D4'

    # Section backgrounds: full-width bands on landing pages.
    # Light bands (Partners, Learn, Volunteer). Dark text on it.
    sectionLightBg = '#E1DFED'
    # Dark bands (blog Keep reading, How it works). textOnDark on it.
    sectionDarkBg = '#19112D'
    # heroBg is unset. The banner uses brand unless a site sets heroBg.

    # Action: teal for filters, focus rings, and links. Separate from brand.
    # Selected filter button. textOnDark sits on it. Links use this unless link is set.
    action = '#2E6060'
    # Text and thin borders on actionLight. Package card top border.
    actionDark = '#142929'
    # Packages header, People page band, training box. Dark text on it.
    actionLight = '#D6E3E3'

    # Small highlights. Not brand or action.
    # Search highlights, stipend label, featured card border. textStrong on it.
    highlight = '#F1E0A6'
    # Icons, pull quotes, event date badge. textOnDark on the date badge.
    accent = '#42213D'
    # Training star, magenta quotes, sprint pills. textStrong on it.
    accentLight = '#E4B8C6'
    # Green Donate button and the green button style. textStrong on it.
    cta = '#71B3B5'

    # Text and surfaces.
    # Page background. Body text sits on it.
    pageBg = '#F9FAFB'
    # Card, dropdown, and white-button backgrounds.
    surface = '#FFFFFF'
    # Text on brand, the hero, and dark bands.
    textOnDark = '#FFFFFF'
    # Card borders, dividers, inactive filter chips.
    border = '#E5E7EB'
    # Dates, captions, and other small meta text.
    textMuted = '#4B5563'
    # Paragraphs and lists.
    text = '#374151'
    # Bold text, card titles, and text on yellow, pink, and green.
    textStrong = '#111827'

    # Links. link is unset and uses action.
    # Links when hovered.
    linkHover = '#1F4345'
    # Nav link hover, links in dark bands, search focus ring.
    linkOnDark = '#2DD4BF'

    # Callout boxes (admonition shortcode). Text inside is text.
    calloutInfo = '#53354F'
    calloutSuccess = '#71B3B5'
    calloutWarning = '#E4B8C6'
    calloutDanger = '#F1E0A6'
    calloutNote = '#CAE4E4'

    # Blog cards with no image. The title on the tile is textOnDark.
    blogPlaceholder1 = '#BB82B0'
    blogPlaceholder2 = '#6B5B95'

    # Documentation page header when front matter color is neutral.
    # No documentation pages yet. The class stays docs-header--neutral.
    docsHeaderBg = '#395E66'

    # Event pills on /events/. Commented out because each matches a color above.
    # Uncomment a key to give that pill its own color.
    # eventLabelTrainingBg = '#D6E3E3' # default: actionLight
    # eventLabelTrainingFg = '#142929' # default: actionDark
    # eventLabelSprintBg = '#E4B8C6' # default: accentLight
    # eventLabelSprintFg = '#111827' # default: textStrong
    # eventLabelCommunityBg = '#F1E0A6' # default: highlight
    # eventLabelCommunityFg = '#111827' # default: textStrong
    # eventLabelTalkBg = '#CAE4E4' # default: calloutNote
    # eventLabelTalkFg = '#142929' # default: actionDark
    # eventDateBadgeBg = '#42213D' # default: accent
    # eventDateBadgeFg = '#FFFFFF' # default: textOnDark

[params.nav_button]
  text = 'Donate'
  url = 'https://give.communityin.org/pyopensci_2024'
  variant = 'green'

# Site search — Algolia InstantSearch (ported from search branch / PR #788).
[params.search]
  enable = true
  title = 'Search our website'
  subtitle = 'Our website includes a Python packaging guide, a peer review guide and lessons that we have built. Search below to explore our resources.'
  placeholder = 'Search the site...'
  no_results = 'No results'
  loading = 'Loading search…'
  error = 'Search is temporarily unavailable. Please try again.'

[params.algolia]
  application_id = 'OCL08AWWSO'
  index_name = 'pyopensci'
  search_only_api_key = '42e1fb9616225e65d332af46f27dba9f'
  powered_by = true

