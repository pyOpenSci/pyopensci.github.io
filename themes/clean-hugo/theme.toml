name = "clean-hugo"
license = "BSD-3-Clause"
licenselink = "https://github.com/lwasser/clean-hugo/blob/main/LICENSE"
description = "A clean, modern Hugo theme with configurable colors and optional gallery feature"
tags = ["blog", "gallery", "minimal", "modern", "hugo", "scss"]
features = ["blog", "gallery", "responsive", "customizable"]
min_version = "0.118.2"

[author]
  name = "Leah A. Wasser"
  homepage = "https://leahwasser.com"

[original]
  author = "Leah A. Wasser"
  homepage = "https://leahwasser.com"
  repo = "https://github.com/lwasser/clean-hugo"

# Default theme parameters (can be overridden in site's hugo.toml)
[params.theme.colors]
  # Brand: nav, footer, h1/h2, main button. textOnDark sits on it.
  brand = "#33205C"
  # Main button when hovered.
  brandHover = "#542668"
  # Outline button borders, focus rings, How it works icons. No text on it.
  brandOutline = "#735FAB"
  # Tag chips, table headers, section dividers. Brand-colored text on it.
  brandTint = "#BAB3D4"

  # Section backgrounds: full-width bands on landing pages.
  # Light bands. Dark text on it.
  sectionLightBg = "#E1DFED"
  # Dark bands. textOnDark on it.
  sectionDarkBg = "#19112D"
  # heroBg is unset. The banner uses brand unless a site sets heroBg.

  # Action: teal for filters, focus rings, and links. Separate from brand.
  action = "#2E6060"
  # Text and thin borders on actionLight.
  actionDark = "#142929"
  # Light teal bands. Dark text on it.
  actionLight = "#D6E3E3"

  # Small highlights. Not brand or action.
  # Search highlights and featured card borders. textStrong on it.
  highlight = "#F1E0A6"
  # Icons and the event date badge. textOnDark on the date badge.
  accent = "#42213D"
  # Pink accent bars and sprint pills. textStrong on it.
  accentLight = "#E4B8C6"
  # Green button. textStrong on it.
  cta = "#71B3B5"

  # Text and surfaces.
  # Page background. Body text sits on it.
  pageBg = "#F9FAFB"
  # Card, dropdown, and white-button backgrounds.
  surface = "#FFFFFF"
  # Text on brand, the hero, and dark bands.
  textOnDark = "#FFFFFF"
  # Card borders, dividers, inactive filter chips.
  border = "#E5E7EB"
  # Dates, captions, and other small meta text.
  textMuted = "#4B5563"
  # Paragraphs and lists.
  text = "#374151"
  # Bold text, card titles, and text on yellow, pink, and green.
  textStrong = "#111827"

  # Links. link is unset and uses action.
  linkHover = "#1F4345"
  # Nav link hover, links in dark bands, search focus ring.
  linkOnDark = "#2DD4BF"

  # Callout boxes (admonition shortcode). Text inside is text.
  calloutInfo = "#53354F"
  calloutSuccess = "#71B3B5"
  calloutWarning = "#E4B8C6"
  calloutDanger = "#F1E0A6"
  calloutNote = "#CAE4E4"

  # Blog cards with no image. The title on the tile is textOnDark.
  blogPlaceholder1 = "#BB82B0"
  blogPlaceholder2 = "#6B5B95"

  # Documentation page header when front matter color is neutral.
  # The class stays docs-header--neutral.
  docsHeaderBg = "#395E66"

  # Event pills. Commented out because each matches a color above.
  # Uncomment a key to give that pill its own color.
  # eventLabelTrainingBg = "#D6E3E3" # default: actionLight
  # eventLabelTrainingFg = "#142929" # default: actionDark
  # eventLabelSprintBg = "#E4B8C6" # default: accentLight
  # eventLabelSprintFg = "#111827" # default: textStrong
  # eventLabelCommunityBg = "#F1E0A6" # default: highlight
  # eventLabelCommunityFg = "#111827" # default: textStrong
  # eventLabelTalkBg = "#CAE4E4" # default: calloutNote
  # eventLabelTalkFg = "#142929" # default: actionDark
  # eventDateBadgeBg = "#42213D" # default: accent
  # eventDateBadgeFg = "#FFFFFF" # default: textOnDark
